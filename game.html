<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>String Cheese Catcher</title>
<style>
body {
  margin: 0;
  background: radial-gradient(circle at center, #0a0a14, #000);
  font-family: monospace;
  color: #0ff;
  overflow: hidden;
}

.topbar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 18px;
  z-index: 10;
}

.nav a {
  display: inline-block;
  color: #0ff;
  text-decoration: none;
  border: 1px solid #0ff;
  border-radius: 6px;
  padding: 6px 14px;
  margin-right: 10px;
  text-shadow: 0 0 8px #0ff;
  box-shadow: 0 0 8px rgba(0, 255, 255, 0.4);
  transition: background 0.2s ease, color 0.2s ease;
}
.nav a:hover {
  background: #0ff;
  color: #0b0b18;
  text-shadow: none;
}

#hud {
  font-size: 16px;
  text-shadow: 0 0 10px #0ff;
}

canvas {
  display: block;
  margin: 64px auto 0;
  background: #0b0b18;
  border: 2px solid #0ff;
  box-shadow: 0 0 20px #0ff;
}

.instructions {
  text-align: center;
  margin-top: 14px;
  font-size: 14px;
  color: #0ff;
  text-shadow: 0 0 8px #0ff;
}
</style>
</head>
<body>

<div class="topbar">
  <div class="nav">
    <a href="index.html">Home</a>
    <a href="resume.html">Resume</a>
    <a href="tennis.html">Tennis</a>
  </div>
  <div id="hud">SCORE: 0   BEST: 0   ❤️❤️❤️</div>
</div>

<canvas id="game" width="500" height="500"></canvas>
<p class="instructions">Use the ← and → arrow keys to catch the falling string cheese. You have 3 lives!</p>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const hud = document.getElementById("hud");

const player = {
  x: 220,
  y: 450,
  w: 60,
  h: 20,
  speed: 15
};

const cheese = {
  x: Math.random() * 460,
  y: -20,
  size: 20,
  fallSpeed: 4
};

let score = 0;
let best = 0;
let lives = 3;
let gameOver = false;

document.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") player.x -= player.speed;
  if (e.key === "ArrowRight") player.x += player.speed;
  if (gameOver && (e.key === "r" || e.key === "R" || e.key === "Enter")) restart();
});

// click to restart after a game over
canvas.addEventListener("click", () => {
  if (gameOver) restart();
});

function restart() {
  score = 0;
  lives = 3;
  cheese.fallSpeed = 4;
  resetCheese();
  gameOver = false;
}

// keep inside screen
function clampPlayer() {
  if (player.x < 0) player.x = 0;
  if (player.x > 440) player.x = 440;
}

function resetCheese() {
  cheese.x = Math.random() * 460;
  cheese.y = -20;
}

function update() {
  if (gameOver) return;

  cheese.y += cheese.fallSpeed;

  // collision
  if (
    cheese.y + cheese.size >= player.y &&
    cheese.x >= player.x &&
    cheese.x <= player.x + player.w
  ) {
    score++;
    if (score > best) best = score;
    resetCheese();

    // difficulty ramp
    cheese.fallSpeed += 0.1;
  }

  // missed
  if (cheese.y > 500) {
    lives--;
    resetCheese();
    cheese.fallSpeed = 4;
    if (lives <= 0) {
      gameOver = true;
      if (score > best) best = score;
    }
  }

  clampPlayer();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // player (mouse)
  ctx.shadowColor = "#ff4fd8";
  ctx.shadowBlur = 20;
  ctx.font = "54px serif";
  ctx.fillText("🐭", player.x, player.y + 24);

  // cheese
  ctx.shadowColor = "#ffd84d";
  ctx.shadowBlur = 20;
  ctx.fillStyle = "#ffd84d";
  ctx.fillRect(cheese.x, cheese.y, cheese.size, cheese.size);

  ctx.font = "16px monospace";
  ctx.fillStyle = "#000";
  ctx.fillText("🧀", cheese.x + 2, cheese.y + 16);

  ctx.shadowBlur = 0;

  // game over screen
  if (gameOver) {
    ctx.fillStyle = "rgba(0, 0, 0, 0.72)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#0ff";
    ctx.shadowColor = "#0ff";
    ctx.shadowBlur = 20;
    ctx.textAlign = "center";

    ctx.font = "42px monospace";
    ctx.fillText("GAME OVER", 250, 220);

    ctx.font = "20px monospace";
    ctx.fillText("Final Score: " + score, 250, 270);
    ctx.fillText("Press R or click to play again", 250, 310);

    ctx.textAlign = "left";
    ctx.shadowBlur = 0;
  }

  hud.textContent = `SCORE: ${score}   BEST: ${best}   ${"❤️".repeat(lives)}`;
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>String Cheese Catcher</title>
<style>
body {
  margin: 0;
  background: radial-gradient(circle at center, #0a0a14, #000);
  font-family: monospace;
  color: #0ff;
  overflow: hidden;
}

.topbar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 18px;
  z-index: 10;
}

.nav a, .sound-btn {
  display: inline-block;
  color: #0ff;
  background: transparent;
  text-decoration: none;
  border: 1px solid #0ff;
  border-radius: 6px;
  padding: 6px 14px;
  margin-right: 10px;
  font-family: monospace;
  font-size: 14px;
  cursor: pointer;
  text-shadow: 0 0 8px #0ff;
  box-shadow: 0 0 8px rgba(0, 255, 255, 0.4);
  transition: background 0.2s ease, color 0.2s ease;
}
.nav a:hover, .sound-btn:hover {
  background: #0ff;
  color: #0b0b18;
  text-shadow: none;
}

#hud {
  font-size: 16px;
  text-shadow: 0 0 10px #0ff;
}

canvas {
  display: block;
  margin: 64px auto 0;
  background: #0b0b18;
  border: 2px solid #0ff;
  box-shadow: 0 0 20px #0ff;
}

.instructions {
  text-align: center;
  margin-top: 14px;
  font-size: 14px;
  color: #0ff;
  text-shadow: 0 0 8px #0ff;
}
</style>
</head>
<body>

<div class="topbar">
  <div class="nav">
    <a href="index.html">Home</a>
    <a href="resume.html">Resume</a>
    <a href="tennis.html">Tennis</a>
    <button id="soundBtn" class="sound-btn">🔊 Music</button>
  </div>
  <div id="hud">SCORE: 0   BEST: 0   ❤️❤️❤️</div>
</div>

<canvas id="game" width="500" height="500"></canvas>
<p class="instructions">Use the ← and → arrow keys to catch the falling string cheese. You have 3 lives. Music starts when you move!</p>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const hud = document.getElementById("hud");
const soundBtn = document.getElementById("soundBtn");

const player = {
  x: 220,
  y: 450,
  w: 60,
  h: 20,
  speed: 18
};

const cheese = {
  x: Math.random() * 460,
  y: -20,
  size: 20,
  fallSpeed: 4
};

let score = 0;
let best = 0;
let lives = 3;
let gameOver = false;
let bubbleTimer = 0;   // frames the "Go Cougars!" bubble stays up

/* ---------- Audio (Web Audio API, no files needed) ---------- */
let audioCtx = null;
let musicOn = true;
let musicTimer = null;
let step = 0;

const melody = [659, 659, 784, 784, 880, 880, 784, 0, 698, 698, 659, 659, 587, 587, 523, 0];
const bass = [131, 175, 196, 147];

function initAudio() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    startMusic();
  } catch (e) { /* audio unsupported, game still works */ }
}

function playTone(freq, duration, type, volume) {
  if (!audioCtx || !musicOn) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  const now = audioCtx.currentTime;
  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.linearRampToValueAtTime(volume, now + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + duration);
}

function startMusic() {
  if (musicTimer) return;
  musicTimer = setInterval(() => {
    if (!musicOn || !audioCtx) return;
    const note = melody[step % melody.length];
    if (note) playTone(note, 0.18, "triangle", 0.10);
    if (step % 4 === 0) playTone(bass[Math.floor(step / 4) % bass.length], 0.35, "sine", 0.16);
    step++;
  }, 200);
}

function catchSound() {
  playTone(988, 0.10, "square", 0.20);
  setTimeout(() => playTone(1318, 0.12, "square", 0.20), 60);
}

soundBtn.addEventListener("click", () => {
  initAudio();
  musicOn = !musicOn;
  soundBtn.textContent = musicOn ? "🔊 Music" : "🔇 Muted";
});

/* ---------- Controls ---------- */
document.addEventListener("keydown", e => {
  initAudio();
  if (e.key === "ArrowLeft") player.x -= player.speed;
  if (e.key === "ArrowRight") player.x += player.speed;
  if (gameOver && (e.key === "r" || e.key === "R" || e.key === "Enter")) restart();
});

canvas.addEventListener("click", () => {
  initAudio();
  if (gameOver) restart();
});

function restart() {
  score = 0;
  lives = 3;
  cheese.fallSpeed = 4;
  bubbleTimer = 0;
  resetCheese();
  gameOver = false;
}

/* ---------- Game logic ---------- */
function clampPlayer() {
  if (player.x < 0) player.x = 0;
  if (player.x > 440) player.x = 440;
}

function resetCheese() {
  cheese.x = Math.random() * 460;
  cheese.y = -20;
}

function update() {
  if (gameOver) return;

  cheese.y += cheese.fallSpeed;

  // collision
  if (
    cheese.y + cheese.size >= player.y &&
    cheese.x >= player.x &&
    cheese.x <= player.x + player.w
  ) {
    score++;
    if (score > best) best = score;
    bubbleTimer = 48;     // show "Go Cougars!"
    catchSound();
    resetCheese();
    cheese.fallSpeed += 0.1;
  }

  // missed
  if (cheese.y > 500) {
    lives--;
    resetCheese();
    cheese.fallSpeed = 4;
    if (lives <= 0) {
      gameOver = true;
      if (score > best) best = score;
    }
  }

  if (bubbleTimer > 0) bubbleTimer--;
  clampPlayer();
}

/* ---------- Speech bubble ---------- */
function drawBubble(centerX, topY, text) {
  ctx.font = "bold 16px 'Trebuchet MS', sans-serif";
  const w = ctx.measureText(text).width + 28;
  const h = 34;
  let x = centerX - w / 2;
  if (x < 6) x = 6;
  if (x + w > canvas.width - 6) x = canvas.width - 6 - w;
  const y = topY;
  const r = 10;

  // bubble body
  ctx.fillStyle = "#ffffff";
  ctx.strokeStyle = "#002E5D";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // pointer
  const px = Math.min(Math.max(centerX, x + 20), x + w - 20);
  ctx.beginPath();
  ctx.moveTo(px - 8, y + h - 1);
  ctx.lineTo(px, y + h + 12);
  ctx.lineTo(px + 8, y + h - 1);
  ctx.closePath();
  ctx.fillStyle = "#ffffff";
  ctx.fill();

  // text
  ctx.fillStyle = "#002E5D";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(text, x + w / 2, y + h / 2);
  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";
}

/* ---------- Render ---------- */
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // player (mouse)
  ctx.shadowColor = "#ff4fd8";
  ctx.shadowBlur = 20;
  ctx.font = "54px serif";
  ctx.fillText("🐭", player.x, player.y + 24);

  // cheese
  ctx.shadowColor = "#ffd84d";
  ctx.shadowBlur = 20;
  ctx.fillStyle = "#ffd84d";
  ctx.fillRect(cheese.x, cheese.y, cheese.size, cheese.size);

  ctx.font = "16px monospace";
  ctx.fillStyle = "#000";
  ctx.fillText("🧀", cheese.x + 2, cheese.y + 16);

  ctx.shadowBlur = 0;

  // speech bubble
  if (bubbleTimer > 0) {
    drawBubble(player.x + player.w / 2, 392, "Go Cougars!");
  }

  // game over screen
  if (gameOver) {
    ctx.fillStyle = "rgba(0, 0, 0, 0.72)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#0ff";
    ctx.shadowColor = "#0ff";
    ctx.shadowBlur = 20;
    ctx.textAlign = "center";

    ctx.font = "42px monospace";
    ctx.fillText("GAME OVER", 250, 220);

    ctx.font = "20px monospace";
    ctx.fillText("Final Score: " + score, 250, 270);
    ctx.fillText("Press R or click to play again", 250, 310);

    ctx.textAlign = "left";
    ctx.shadowBlur = 0;
  }

  hud.textContent = `SCORE: ${score}   BEST: ${best}   ${"❤️".repeat(lives)}`;
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
